name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  prepare-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Build Keenetic frontend
        run: make frontend-build FRONTEND_PLATFORM=keenetic
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-keenetic
          path: frontend/dist
          include-hidden-files: true

  keenetic:
    needs: prepare-frontend
    uses: ./.github/workflows/reusable-keenetic-packages.yml
    with:
      build_scope: full
      keenetic_version: current
      frontend_artifact_name: frontend-dist-keenetic

  release:
    name: Publish GitHub Release
    needs: keenetic
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Download Keenetic packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-keenetic-*
          path: release_files
          merge-multiple: true
      - name: Verify all architectures and variants
        shell: bash
        run: |
          set -euo pipefail
          for config in mipsel-3.4 mips-3.4 aarch64-3.10 armv7-3.2 x64-3.2; do
            for pkg in keen-pbr-sx keen-pbr-sx-headless; do
              find release_files -type f -name "${pkg}_*_keenetic_${config}.ipk" | grep -q . || {
                echo "Missing ${pkg} for ${config}" >&2
                exit 1
              }
            done
          done
      - name: Collect release assets and SHA256SUMS
        run: |
          set -euo pipefail
          bash build_scripts/collect-release-assets.sh release_files release_assets
          (
            cd release_assets
            shopt -s nullglob
            packages=( *.ipk )
            test "${#packages[@]}" -eq 10
            sha256sum "${packages[@]}" > SHA256SUMS
          )
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_assets/*

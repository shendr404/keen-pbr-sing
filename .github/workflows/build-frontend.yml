name: Build frontend

on:
  push:
    branches: ['**']
    paths: ['frontend/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile
      - name: Lint, typecheck and build
        run: |
          cd frontend
          bun run lint
          bun run typecheck
          cd ..
          make frontend-build

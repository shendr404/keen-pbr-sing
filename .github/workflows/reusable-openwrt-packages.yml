name: Reusable OpenWrt packages

on:
  workflow_call:
    inputs:
      openwrt_version:
        required: true
        type: string
      architecture:
        required: true
        type: string
      frontend_artifact_name:
        required: false
        type: string
        default: "frontend-dist-openwrt"

jobs:
  build:
    name: "build: ${{ inputs.openwrt_version }} / ${{ inputs.architecture }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend_artifact_name }}
          path: frontend-artifact
      - name: Stage frontend dist
        run: |
          rm -rf "$GITHUB_WORKSPACE/frontend/dist"
          mkdir -p "$GITHUB_WORKSPACE/frontend/dist"
          cp -a "$GITHUB_WORKSPACE/frontend-artifact"/. "$GITHUB_WORKSPACE/frontend/dist/"
      - name: Build packages
        env:
          OPENWRT_USIGN_PRIVATE_KEY: ''
          OPENWRT_APK_PRIVATE_KEY: ''
        run: |
          make openwrt-packages \
            OPENWRT_VERSION="${{ inputs.openwrt_version }}" \
            OPENWRT_ARCHITECTURE="${{ inputs.architecture }}"
      - name: Validate lib files are in the package
        shell: bash
        run: |
          set -euo pipefail
          sh tests/test_package_lib_files.sh
          lib="$GITHUB_WORKSPACE/packages/openwrt/keen-pbr-sx/files/usr/lib/keen-pbr-sx"
          full=0
          headless=0
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            base=$(basename "$package")
            case "$base" in
              keen-pbr-sx-headless_*.ipk|keen-pbr-sx-headless-[0-9]*.apk)
                headless=1
                sh build_scripts/check-package-data.sh "$package" usr/lib/keen-pbr-sx "$lib"
                ;;
              keen-pbr-sx_*.ipk|keen-pbr-sx-[0-9]*.apk)
                full=1
                sh build_scripts/check-package-data.sh "$package" usr/lib/keen-pbr-sx "$lib"
                ;;
            esac
          done < <(find build/packages/openwrt -type f \( -name '*.ipk' -o -name '*.apk' \) -print)
          [ "$full" -eq 1 ] && [ "$headless" -eq 1 ]
      - name: Upload unsigned packages
        uses: actions/upload-artifact@v6
        with:
          name: packages-openwrt-${{ inputs.openwrt_version }}-${{ inputs.architecture }}
          path: build/packages/openwrt
          if-no-files-found: error

name: Build packages

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'build_scripts/**'
      - 'cmake/**'
      - 'docker/**'
      - 'frontend/**'
      - 'include/**'
      - 'packages/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'version.mk'
  workflow_dispatch:
    inputs:
      family:
        description: Package family
        type: choice
        options: [keenetic, openwrt, debian]
        default: keenetic
      scope:
        description: Build scope
        type: choice
        options: [default, full]
        default: default

permissions:
  contents: read

jobs:
  prepare-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend bundles
        run: |
          set -euo pipefail
          for platform in generic openwrt keenetic; do
            make frontend-build FRONTEND_PLATFORM="$platform"
            mkdir -p "frontend-artifact-$platform"
            cp -a frontend/dist/. "frontend-artifact-$platform/"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-generic
          path: frontend-artifact-generic
          include-hidden-files: true
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-openwrt
          path: frontend-artifact-openwrt
          include-hidden-files: true
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-keenetic
          path: frontend-artifact-keenetic
          include-hidden-files: true

  keenetic:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.family == 'keenetic' }}
    needs: prepare-frontend
    uses: ./.github/workflows/reusable-keenetic-packages.yml
    with:
      build_scope: ${{ inputs.scope || 'default' }}
      keenetic_version: current
      frontend_artifact_name: frontend-dist-keenetic

  openwrt:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.family == 'openwrt' }}
    needs: prepare-frontend
    uses: ./.github/workflows/reusable-openwrt-packages.yml
    with:
      openwrt_version: '24.10.6'
      architecture: aarch64_cortex-a53
      frontend_artifact_name: frontend-dist-openwrt

  debian:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.family == 'debian' }}
    needs: prepare-frontend
    uses: ./.github/workflows/reusable-deb-packages.yml
    with:
      build_scope: ${{ inputs.scope || 'default' }}
      frontend_artifact_name: frontend-dist-generic

baseURL: https://shendr404.github.io/keen-pbr-sx/
defaultContentLanguage: ru
defaultContentLanguageInSubtitle: ""
languageCode: ru-ru
title: keen-pbr-sx

languages:
  en:
    languageName: English
    weight: 2
    params:
      languageSuggestion:
        title: Prefer English?
        text: The English version of the site is available.
        switch: Switch to English
        dismiss: Close language suggestion
  ru:
    languageName: Русский
    weight: 1
    params:
      languageSuggestion:
        title: Предпочитаете русский?
        text: Русская версия сайта уже доступна.
        switch: Перейти на русский
        dismiss: Закрыть предложение сменить язык

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

params:
  search:
    enable: true
    type: flexsearch
  footer:
    displayCopyright: false
    displayPoweredBy: false
  navbar:
    logo:
      path: logo.svg
      width: 32
      height: 32
    width: wide
  page:
    width: wide
    tabs:
      sync: true
    contextMenu:
      enable: false

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

menu:
  main:
    - name: Docs
      identifier: docs
      pageRef: /docs
      weight: 10
    
    - name: Search
      weight: 20
      params:
        type: search
    
    - name: GitHub
      url: https://github.com/shendr404/keen-pbr-sx
      weight: 30
      params:
        icon: github
    
